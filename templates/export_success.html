<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Export - ComicCraft AI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <main class="container center">

        <section class="card">

            <h1>
                Comic Export Ready
            </h1>

            <p>
                Your ComicCraft AI comic PDF is ready.
            </p>

            <div class="actions">

                <a
                    class="button"
                    href="{{ pdf_url }}"
                    target="_blank"
                >
                    Open PDF
                </a>

                <a
                    class="button secondary"
                    href="/"
                >
                    Create Another Comic
                </a>

            </div>

        </section>

    </main>

</body>
</html>
